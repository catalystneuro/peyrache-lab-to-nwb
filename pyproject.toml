[project]
name = "peyrache-lab-to-nwb"
version = "0.0.1"
description = "NWB conversion scripts, functions, and classes for the Peyrache Lab data."
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
maintainers = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Shared by every conversion. Each conversion's own dependencies are an optional extra, so each can
# be installed in its own environment: pip install -e ".[miniscope_arc]" or ".[dandi_000939]".
dependencies = [
    "pynwb",
    "hdmf",
    "nwbinspector",
    "pandas",
    "numpy",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
# DANDI:001676: raw Miniscope, Intan and OptiTrack data
miniscope_arc = [
    # Intan analog events (https://github.com/catalystneuro/neuroconv/pull/2052) are not yet in a release.
    "neuroconv[intan,miniscope,optitrack] @ git+https://github.com/catalystneuro/neuroconv.git@main",
    "ndx-miniscope",
    "roiextractors",
    "tqdm",
]
# DANDI:000939: HED annotation of the published sleep states
dandi_000939 = [
    "ndx-hed==0.3.0",
    "dandi",
    "h5py",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/catalystneuro/peyrache-lab-to-nwb"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "*.yaml",
    "*.yml",
    "*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peyrache_lab_to_nwb"]

[tool.hatch.build.targets.sdist]
packages = ["src/peyrache_lab_to_nwb"]

[tool.ruff]

[tool.ruff.lint]
select = [
    "F401",
    "I",
    "UP006",
    "UP007",
    "UP045",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["peyrache_lab_to_nwb"]

[tool.codespell]
skip = '.git*,*.pdf,*.csv,*.nwb'
check-hidden = true
ignore-words-list = 'assertin'
