[project]
name = "peyrache-lab-to-nwb"
version = "0.0.1"
description = "NWB conversion scripts, functions, and classes for the Peyrache Lab data."
readme = "README.md"
authors = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
maintainers = [{ name = "CatalystNeuro", email = "ben.dichter@catalystneuro.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "neuroconv",
    "nwbinspector",
    "ndx-miniscope",
    "roiextractors",
    "pandas",
    "numpy",
    "tqdm",
    "hdmf",
]

[project.urls]
Repository = "https://github.com/catalystneuro/peyrache-lab-to-nwb"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "*.yaml",
    "*.yml",
    "*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peyrache_lab_to_nwb"]

[tool.hatch.build.targets.sdist]
packages = ["src/peyrache_lab_to_nwb"]

[tool.ruff]

[tool.ruff.lint]
select = [
    "F401",
    "I",
    "UP006",
    "UP007",
    "UP045",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["peyrache_lab_to_nwb"]

[tool.codespell]
skip = '.git*,*.pdf,*.csv,*.nwb'
check-hidden = true
ignore-words-list = 'assertin'
