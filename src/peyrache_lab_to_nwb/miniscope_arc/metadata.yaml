NWBFile:
  keywords:
    - head direction
    - calcium imaging
    - miniscope
    - longitudinal recording
    - freely moving
    - rat
    - SFARI
  related_publications:
    - doi:10.1101/2024.06.13.598909
  session_description: >
    Raw calcium imaging (UCLA Miniscope V4) and OptiTrack 3-D motion capture
    data from freely exploring rats.  Part of a longitudinal study of head-direction
    cell stability over months.  This NWB file contains raw acquisition data;
    corresponding processed data (DF/F, ROI footprints, CellReg registration) are
    in DANDI:001676.
  experiment_description: >
    SFARI Autism Rat Models Consortium (ARC) project.  Rats were implanted with
    a UCLA Miniscope V4 head-mounted fluorescence microscope for longitudinal
    calcium imaging of head-direction cells in the anterodorsal thalamus during
    free exploration of an open arena.  3-D head position and orientation were
    tracked simultaneously using OptiTrack Motive motion capture.  An Intan RHD
    system recorded hardware synchronisation signals (TTL pulses) connecting the
    three recording systems to a common clock.
  institution: McGill University
  lab: Peyrache
  experimenter:
    - Skromne Carrasco, Sol
    - Viejo, Guillaume
    - Peyrache, Adrien

Subject:
  species: Rattus norvegicus
  description: >
    Adult rat implanted with a UCLA Miniscope V4 head-mounted fluorescence
    microscope for longitudinal calcium imaging.  Subject is part of the
    SFARI Autism Rat Models Consortium (ARC) cohort.
  # TODO (open question Q7): fill in sex, date_of_birth, weight, genotype
  # from lab records for each subject before DANDI upload.
  # sex: U          # M / F / U / O
  # age: P6M        # ISO 8601 duration

Ophys:
  OnePhotonSeries:
    - name: OnePhotonSeries
      description: >
        Raw calcium imaging video from a UCLA Miniscope V4 one-photon fluorescence
        microscope.  Data are acquired as MJPEG-compressed AVI chunks (2 000 frames
        each) and stored here as a single concatenated array.  Timestamps are derived
        from the Intan hardware sync channel (ADC-01, square-wave frame gate) rather
        than from the Miniscope USB timestamps, which exhibit up to 236 ms of clock
        drift over a 20-minute session.
      unit: n.a.
  ImagingPlane:
    - name: ImagingPlane
      description: >
        Imaging plane for UCLA Miniscope V4 one-photon calcium imaging.
        Brain region and depth are stored in the associated processed NWB file
        (DANDI:001676).
      excitation_lambda: 470.0      # nm — blue LED excitation for GCaMP
      # TODO: confirm excitation wavelength from lab (LED0 specification)
      location: unknown
      indicator: GCaMP
      # TODO (open question Q7): confirm GCaMP variant (GCaMP6f / GCaMP7f / etc.)
      grid_spacing: [1.0, 1.0]
      grid_spacing_unit: micrometers
